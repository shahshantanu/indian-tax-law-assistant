<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Tax Law Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .container {
            max-width: 960px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .query-box {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
        }
        .response-container {
            margin-top: 20px;
        }
        .response-box {
            border-radius: 8px;
            padding: 20px;
            background-color: #fff;
        }
        .response-analysis {
            background-color: #f0f7ff;
            border-left: 4px solid #0d6efd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .response-answer {
            background-color: #e8f5e9;
            border-left: 4px solid #2e7d32;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .citations {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .loader {
            display: none;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0d6efd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .header {
            margin-bottom: 30px;
        }
        .logo {
            max-height: 60px;
        }
        .example-queries {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .example-query {
            cursor: pointer;
            text-decoration: underline;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header text-center">
            <h1 class="display-4">
                <span class="text-primary">Indian Tax Law</span> Assistant
            </h1>
            <p class="lead text-muted">Powered by Multi-Agent AI System with LLM & Vector Search</p>
        </div>

        <div class="query-box card">
            <div class="card-body">
                <h5 class="card-title">Ask your tax law question</h5>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="queryInput" placeholder="e.g., What are the deductions under section 80C?">
                    <button class="btn btn-primary" type="button" id="submitBtn">Submit</button>
                </div>
                <div class="example-queries">
                    <small class="text-muted">Try these examples: </small>
                    <span class="example-query" data-query="What are the deductions under section 80C?">Section 80C deductions</span> |
                    <span class="example-query" data-query="Explain the tax implications for senior citizens">Tax for senior citizens</span> |
                    <span class="example-query" data-query="What are the penalties for late filing of returns?">Late filing penalties</span>
                </div>
            </div>
        </div>

        <div class="loader" id="loader"></div>

        <div class="response-container" id="responseContainer" style="display: none;">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Response</h5>
                    
                    <div class="response-box">
                        <h6>Answer</h6>
                        <div class="response-answer" id="answer"></div>
                        
                        <h6>Legal Analysis</h6>
                        <div class="response-analysis" id="analysis"></div>
                        
                        <div class="citations">
                            <h6>Citations</h6>
                            <ul id="citations"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const queryInput = document.getElementById('queryInput');
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const responseContainer = document.getElementById('responseContainer');
            const answerElement = document.getElementById('answer');
            const analysisElement = document.getElementById('analysis');
            const citationsElement = document.getElementById('citations');
            const exampleQueries = document.querySelectorAll('.example-query');

            // Base API URL - update with your actual API port
            // This will be updated automatically when the page loads
            let apiBaseUrl = '';

            // Function to get API URL from the current window location
            function getApiUrl() {
                const loc = window.location;
                // If we're running on a specific port, use that for the API
                // Otherwise assume the API is on the same host/port as this page
                return `${loc.protocol}//${loc.hostname}:${loc.port}`;
            }

            // Set API URL when page loads
            apiBaseUrl = getApiUrl();
            console.log(`API URL: ${apiBaseUrl}`);

            // Handle example query clicks
            exampleQueries.forEach(example => {
                example.addEventListener('click', function() {
                    queryInput.value = this.getAttribute('data-query');
                    submitBtn.click();
                });
            });

            // Handle form submission
            submitBtn.addEventListener('click', async function() {
                const query = queryInput.value.trim();
                if (!query) return;

                // Show loader, hide previous response
                loader.style.display = 'block';
                responseContainer.style.display = 'none';
                
                try {
                    const response = await fetch(`${apiBaseUrl}/ask`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ 
                            query: query,
                            k: 8 
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error ${response.status}: ${await response.text()}`);
                    }

                    const data = await response.json();
                    
                    // Display the response
                    answerElement.textContent = data.answer;
                    analysisElement.textContent = data.analysis;
                    
                    // Clear previous citations
                    citationsElement.innerHTML = '';
                    
                    // Add citations
                    if (data.citations && data.citations.length > 0) {
                        data.citations.forEach(citation => {
                            const li = document.createElement('li');
                            li.textContent = citation;
                            citationsElement.appendChild(li);
                        });
                    } else {
                        const li = document.createElement('li');
                        li.textContent = 'No specific citations provided';
                        citationsElement.appendChild(li);
                    }
                    
                    // Show response container
                    responseContainer.style.display = 'block';
                } catch (error) {
                    console.error('Error:', error);
                    alert(`Error querying the API: ${error.message}. Please check if the API server is running.`);
                } finally {
                    loader.style.display = 'none';
                }
            });

            // Submit on Enter key
            queryInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    submitBtn.click();
                }
            });
        });
    </script>
</body>
</html>
